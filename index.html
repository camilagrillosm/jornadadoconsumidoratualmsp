<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jornada Atual da Visita</title>
  <link rel="preload" href="assets/fonts/baloo-2-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css?v=6">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <header class="topo">
    <p class="topo-texto" id="cabecalho"></p>
    <div class="topo-logos">
      <img src="assets/logo-espm.png" alt="ESPM" class="logo-espm">
      <img src="assets/logo-msp.png" alt="MSP Estúdios" class="logo-msp">
    </div>
  </header>

  <main id="app"></main>

  <div class="modal-fundo" id="modal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <button class="voltar" id="modal-voltar" type="button">Voltar</button>
      <h3 id="modal-titulo"></h3>
      <div class="modal-conteudo" id="modal-conteudo"></div>
    </section>
  </div>

  <script src="conteudo.js"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
